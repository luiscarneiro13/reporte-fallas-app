# =========================================================================
# Docker Compose de Construcción y Desarrollo - IronFlow App
# =========================================================================

services:
  expo:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ironflow-expo

    # Modo host para permitir que los dispositivos de la LAN se conecten a Metro Packager
    network_mode: host

    environment:
      NODE_ENV: development
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      
      # Optimización para detección de cambios de código en Linux/Docker
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
      FAST_REFRESH: "true"

      # Autenticación automática de EAS
      EXPO_TOKEN: ${EXPO_TOKEN}

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    stdin_open: true
    tty: true
    working_dir: /app

    command: >
      sh -c "
      [ -d node_modules/react ] || npm install --legacy-peer-deps &&
      npx expo start --dev-client --host lan --clear
      "

volumes:
  node_modules: